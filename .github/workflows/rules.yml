name: Portable gameplay rules (not an Unreal build)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  battle-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable combat rules
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -I Source/FinalTower/Public Tests/battle_rules_test.cpp -o /tmp/finaltower-rules
      - name: Check combat and recruitment edge cases
        run: /tmp/finaltower-rules
