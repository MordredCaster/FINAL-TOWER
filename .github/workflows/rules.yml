name: Portable gameplay rules (not an Unreal build)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  battle-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable combat rules
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -I Source/FinalTower/Public Tests/battle_rules_test.cpp -o /tmp/finaltower-rules
      - name: Check combat and recruitment edge cases
        run: /tmp/finaltower-rules
      - name: Check progression, techniques, relays and save migration rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -I Source/FinalTower/Public Tests/progression_rules_test.cpp -o /tmp/finaltower-progression
          /tmp/finaltower-progression
      - name: Compile and check camera-relative sprite directions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I Source/FinalTower/Public Tests/sprite_rules_test.cpp -o /tmp/finaltower-sprites
          /tmp/finaltower-sprites
      - name: Check inventory, consumables, loot and inventory migration rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -I Source/FinalTower/Public Tests/inventory_rules_test.cpp -o /tmp/finaltower-inventory
          /tmp/finaltower-inventory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source art and prepared atlases
        run: |
          python -m pip install 'Pillow>=10,<13'
          python Tests/check_art.py
